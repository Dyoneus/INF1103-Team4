
name: SafeReport CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest tests test_script.py -q

      - name: Build Docker image
        run: docker compose build web

      - name: Run automated tests in Docker image
        run: >
          docker run --rm
          -e SAFEREPORT_DATABASE_PATH=/tmp/safereport-ci.db
          safereport:local
          python -m pytest tests test_script.py -q

      - name: Verify web container health
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          SAFEREPORT_DATABASE_PATH=/tmp/safereport-ci.db \
            docker compose up --detach --wait --wait-timeout 60 web
          docker compose ps
