services:
  safereport:
    build: .
    stdin_open: true
    tty: true
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./data:/data

  # Web interface: docker compose up web, then open http://localhost:5000
  web:
    build: .
    command: python web_app.py
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SAFEREPORT_HOST: 0.0.0.0
      SAFEREPORT_ADMIN_USERNAME: ${SAFEREPORT_ADMIN_USERNAME:-}
      SAFEREPORT_ADMIN_PASSWORD: ${SAFEREPORT_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./reports:/app/reports
      - ./data:/data
