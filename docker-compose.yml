services:
  safereport:
    build: .
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY_ENV: ${AI_API_KEY_ENV:-}
      SAFEREPORT_DATABASE_PATH: ${SAFEREPORT_DATABASE_PATH:-/data/safereport.db}
      SAFEREPORT_SECRET_KEY: ${SAFEREPORT_SECRET_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./data:/data

  # Web interface: docker compose up web, then open http://localhost:5000
  web:
    build: .
    image: safereport:local
    command: python web_app.py
    env_file:
      - path: .env
        required: false
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY_ENV: ${AI_API_KEY_ENV:-}
      SAFEREPORT_DATABASE_PATH: ${SAFEREPORT_DATABASE_PATH:-/data/safereport.db}
      SAFEREPORT_SECRET_KEY: ${SAFEREPORT_SECRET_KEY:-}
      SAFEREPORT_HOST: 0.0.0.0
      SAFEREPORT_ADMIN_USERNAME: ${SAFEREPORT_ADMIN_USERNAME:-}
      SAFEREPORT_ADMIN_PASSWORD: ${SAFEREPORT_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./reports:/app/reports
      - ./data:/data
